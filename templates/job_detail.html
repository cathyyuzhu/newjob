<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职位详情</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <div>
        <h1 id="detailJobTitle">职位详情</h1>
        <div class="sub">
          匹配分析 · AI 对话 · 备注
          <a class="job-link" id="detailJobUrl" href="#" target="_blank" rel="noopener noreferrer">查看原职位页面 ↗</a>
        </div>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-secondary btn-sm" href="/">← 返回职位列表</a>
      <!-- 看完详情决定"不投"是这个页面最常见的出口之一，不用先返回列表再去找那张卡片点忽略。
           走跟列表一样的"先执行、给撤销"，不弹二次确认（见 dismissFromDetailPage()）。 -->
      <button class="btn btn-secondary btn-sm" id="detailDismissBtn" onclick="dismissFromDetailPage()" title="标记为已忽略（可在提示条上撤销）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        忽略
      </button>
      <a class="btn btn-secondary btn-sm" id="detailPrepLink" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg>
        面试准备 →
      </a>
      <button class="icon-btn" id="themeToggle" title="切换深色模式" onclick="toggleTheme()">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </header>

  <div class="detail-layout">
    <section id="detailMain"></section>
    <aside class="detail-sidebar">
      <div class="side-panel">
        <div class="side-panel-head">
          <strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>AI 对话</strong>
          <select class="model-select" id="detailChatModelSelect" title="对话用哪个模型"
            onchange="setTaskModel('job_chat', this.value, this)"></select>
        </div>
        <div id="jobChatBody"></div>
      </div>
      <div class="side-panel">
        <div class="side-panel-head">
          <strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>备注</strong>
        </div>
        <div id="jobNotesBody"></div>
      </div>
    </aside>
  </div>

</div>

<div class="toast-stack" id="toastStack"></div>

<script>window.DETAIL_JOB_ID = {{ job_id }};</script>
<script src="/static/common.js"></script>
<script src="/static/job_detail.js"></script>
</body>
</html>
